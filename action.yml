name: "git add a report if it has changed"
description: "Uploads reports only when they have changed, retaining timestamped versions when requested"
inputs:
  filePath:
    description: 'The path to the report file or dir'
    required: true
  destinationDir:
    description: 'The destination directory for the report type. Every report has to be in its own directory'
    required: true
  keepAllVersions:
    description: 'Whether to keep prior versions. Directory reports are always stored in timestamped folders; when false, only the newest folder is kept.'
    default: 'true'
    required: false
  reportIsDirectory:
    description: 'Set to true if the report is not a file but a directory'
    default: 'false'
    required: false
  BUCKET_ACCESS_KEY_ID:
    description: "Access Key for the reports S3 Bucket"
    required: true
  BUCKET_SECRET_ACCESS_KEY:
    description: "Secret Access Key for the reports S3 Bucket"
    required: true
  BUCKET_ENDPOINT_URL:
    description: "Endpoint url for the reports S3 Bucket"
    default: "https://object.storage.eu01.onstackit.cloud/"
    required: false
  BUCKET_REGION:
    description: "Region for the reports S3 Bucket"
    default: "eu01"
    required: false
  BUCKET_NAME:
    description: "Name of the reports S3 Bucket"
    default: "ds-ris-reports-prod"
    required: false
runs:
  using: 'composite'
  steps:
    - name: Setup s3 cli
      shell: bash
      run: aws configure set default.s3.max_concurrent_requests 50
    - name: Check that file path does not target a directory
      if: inputs.reportIsDirectory == 'false'
      shell: bash
      run: |
        if [ -d "${{ inputs.filePath }}" ]; then
          echo "File is a directory. Set input 'reportIsDirectory' to 'true'."
          exit 1
        fi
    - name: Check if report has changed (directory)
      shell: bash
      id: file-check-directory
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.BUCKET_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.BUCKET_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.BUCKET_ENDPOINT_URL }}
        AWS_DEFAULT_REGION: ${{ inputs.BUCKET_REGION }}
      if: inputs.reportIsDirectory == 'true'
      run: |
        comparison_dir=$(mktemp -d)
        latest_folder=$(aws s3 ls "s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/" \
          | awk '$1 == "PRE" && $2 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}\/$/ { sub(/\/$/, "", $2); print $2 }' \
          | sort \
          | tail -n 1)
        echo "latest_folder=$latest_folder" >> $GITHUB_OUTPUT

        if [ -n "$latest_folder" ]; then
          aws s3 sync --only-show-errors \
            "s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/${latest_folder}" \
            "$comparison_dir"
        fi

        if [ -z "$latest_folder" ] || ! diff -rq "${{ inputs.filePath }}" "$comparison_dir"; then
          echo "Files changed"
          echo "file_changed=true" >> $GITHUB_OUTPUT
        else
          echo "Files are the same"
          echo "file_changed=false" >> $GITHUB_OUTPUT
        fi
    - name: Store directory report
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.BUCKET_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.BUCKET_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.BUCKET_ENDPOINT_URL }}
        AWS_DEFAULT_REGION: ${{ inputs.BUCKET_REGION }}
      if: inputs.reportIsDirectory == 'true' && steps.file-check-directory.outputs.file_changed == 'true' && inputs.keepAllVersions == 'true'
      run: |
        folder="${{ steps.file-check-directory.outputs.latest_folder }}"
        if [ "${{ steps.file-check-directory.outputs.file_changed }}" = "true" ]; then
          if [ "${{ inputs.keepAllVersions }}" = "true" ] || [ -z "$folder" ]; then
            folder=$(TZ=Europe/Berlin date +'%Y-%m-%dT%H%M%S')
          fi
          aws s3 sync --only-show-errors \
            "${{ inputs.filePath }}" \
            "s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/${folder}" \
            --delete
        fi

        if [ "${{ inputs.keepAllVersions }}" != "true" ]; then
          folders=$(aws s3 ls "s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/" \
            | awk '$1 == "PRE" && $2 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}\/$/ { sub(/\/$/, "", $2); print $2 }')
          while IFS= read -r old_folder; do
            [ -n "$old_folder" ] || continue
            if [ "$old_folder" != "$folder" ]; then
              aws s3 rm --only-show-errors \
                "s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/${old_folder}/" \
                --recursive
            fi
          done <<< "$folders"
          aws s3 rm --only-show-errors \
            "s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/latest/" \
            --recursive
        fi
    - name: Check if report has changed (file)
      shell: bash
      id: file-check-file
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.BUCKET_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.BUCKET_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.BUCKET_ENDPOINT_URL }}
        AWS_DEFAULT_REGION: ${{ inputs.BUCKET_REGION }}
      if: inputs.reportIsDirectory == 'false'
      run: |
        filepath=${{ inputs.filePath }}
        extension=${filepath##*.}
        mkdir -p tmp/add-ris-report/${{ inputs.destinationDir }}
        aws s3 cp --only-show-errors s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/latest.$extension tmp/add-ris-report/${{ inputs.destinationDir }}/latest.$extension || true
        if [ -f tmp/add-ris-report/${{ inputs.destinationDir }}/latest.$extension ] && cmp -s ${{ inputs.filePath }} tmp/add-ris-report/${{ inputs.destinationDir }}/latest.$extension; then
          echo "Files are the same"
          echo "file_changed=false" >> $GITHUB_OUTPUT
        else
          echo "File changed"
          echo "file_changed=true" >> $GITHUB_OUTPUT
        fi
    - name: Add latest report (file)
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.BUCKET_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.BUCKET_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.BUCKET_ENDPOINT_URL }}
        AWS_DEFAULT_REGION: ${{ inputs.BUCKET_REGION }}
      if: inputs.reportIsDirectory == 'false' && steps.file-check-file.outputs.file_changed == 'true'
      run: |
        filepath=${{ inputs.filePath }}
        extension=${filepath##*.}
        aws s3 cp --only-show-errors ${{ inputs.filePath }} s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/latest.$extension
    - name: Add timestamped report (file)
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.BUCKET_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.BUCKET_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.BUCKET_ENDPOINT_URL }}
        AWS_DEFAULT_REGION: ${{ inputs.BUCKET_REGION }}
      if: inputs.reportIsDirectory == 'false' && steps.file-check-file.outputs.file_changed == 'true' && inputs.keepAllVersions == 'true'
      run: |
        NOW=$(TZ=Europe/Berlin date +'%Y-%m-%dT%H%M%S')
        filepath=${{ inputs.filePath }}
        extension=${filepath##*.}
        aws s3 cp --only-show-errors ${{ inputs.filePath }} s3://${{ inputs.BUCKET_NAME }}/${{ inputs.destinationDir }}/$NOW.$extension