name: "Upload a report"
description: "Uploads a report for ris-reports. Ignores reports that have not changed and retains a history when requested"
inputs:
  filePath:
    description: 'The path to the report file or dir'
    required: true
  destinationDir:
    description: 'The destination directory for the report type. Every report has to be in its own directory'
    required: true
  keepAllVersions:
    description: 'Whether to keep prior versions. Directory reports are always stored in timestamped folders; when false, only the newest folder is kept.'
    default: 'true'
    required: false
  reportIsDirectory:
    description: 'Set to true if the report is not a file but a directory'
    default: 'false'
    required: false
  skipComparison:
    description: 'Set to true to always upload the report without downloading and comparing the previous one. Useful for reports that change on every run.'
    default: 'false'
    required: false
  BUCKET_ACCESS_KEY_ID:
    description: "Access Key for the reports S3 Bucket"
    required: true
  BUCKET_SECRET_ACCESS_KEY:
    description: "Secret Access Key for the reports S3 Bucket"
    required: true
  BUCKET_ENDPOINT_URL:
    description: "Endpoint url for the reports S3 Bucket"
    default: "https://object.storage.eu01.onstackit.cloud/"
    required: false
  BUCKET_REGION:
    description: "Region for the reports S3 Bucket"
    default: "eu01"
    required: false
  BUCKET_NAME:
    description: "Name of the reports S3 Bucket"
    default: "ds-ris-reports-prod"
    required: false
runs:
  using: 'composite'
  steps:
    - name: Store report if changed
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.BUCKET_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.BUCKET_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.BUCKET_ENDPOINT_URL }}
        AWS_DEFAULT_REGION: ${{ inputs.BUCKET_REGION }}
        FILE_PATH: ${{ inputs.filePath }}
        BUCKET: ${{ inputs.BUCKET_NAME }}
        DIR: ${{ inputs.destinationDir }}
        KEEP_ALL: ${{ inputs.keepAllVersions }}
        IS_DIR: ${{ inputs.reportIsDirectory }}
        SKIP_COMPARISON: ${{ inputs.skipComparison }}
      run: |
        set -euo pipefail
        aws configure set default.s3.max_concurrent_requests 200
        DEST="s3://$BUCKET/$DIR"
        now=$(TZ=Europe/Berlin date +'%Y-%m-%dT%H%M%S')
        tmp=$(mktemp -d)

        if [ "$IS_DIR" = "true" ]; then
          if [ "$SKIP_COMPARISON" != "true" ]; then
            latest=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$DIR/" --delimiter / \
              --query 'max(CommonPrefixes[].Prefix)' --output text)
            if [ "$latest" != "None" ]; then
              aws s3 sync --only-show-errors "s3://$BUCKET/$latest" "$tmp"
              if diff -rq "$FILE_PATH" "$tmp"; then
                echo "Files are the same"
                exit 0
              fi
            fi

            echo "Files changed"
          fi

          aws s3 sync --only-show-errors "$FILE_PATH" "$DEST/$now"

          if [ "$KEEP_ALL" != "true" ]; then
            aws s3 rm --only-show-errors "$DEST/" --recursive --exclude "$now/*"
          fi
        else
          if [ -d "$FILE_PATH" ]; then
            echo "File is a directory. Set input 'reportIsDirectory' to 'true'."
            exit 1
          fi
          ext="${FILE_PATH##*.}"

          if [ "$SKIP_COMPARISON" != "true" ]; then
            aws s3 cp --only-show-errors "$DEST/latest.$ext" "$tmp/latest" || true
            if [ -f "$tmp/latest" ] && cmp -s "$FILE_PATH" "$tmp/latest"; then
              echo "Files are the same"
              exit 0
            fi

            echo "File changed"
          fi

          aws s3 cp --only-show-errors "$FILE_PATH" "$DEST/latest.$ext"

          if [ "$KEEP_ALL" = "true" ]; then
            aws s3 cp --only-show-errors "$FILE_PATH" "$DEST/$now.$ext"
          fi
        fi
